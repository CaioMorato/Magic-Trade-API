spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mtg_trade_api
    username: postgres
    password: pass123

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
